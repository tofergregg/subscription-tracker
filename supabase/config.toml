# Supabase CLI configuration.
#
# project_id is which Supabase project `supabase functions deploy` talks to.
# It is not a secret: it is the same identifier that appears in your project
# URL. The keys are never stored in this file.
project_id = "rjmgqrnkuooqqitwbbrz"

# verify_jwt = true means Supabase rejects any call to this function that does
# not carry a valid signed-in session. It is the default, and it is written out
# here so the choice is visible rather than implied. Turning it off would let
# anyone on the internet call your function, and your function is the thing
# holding the email credential.
[functions.notify-cancellation]
verify_jwt = true

[functions.summarize-subscriptions]
verify_jwt = true

[functions.send-renewal-reminder]
verify_jwt = true

# The schedule has no signed-in user to present, so this one cannot verify a
# session. It checks a shared secret instead: see the function's own header.
[functions.scheduled-reminders]
verify_jwt = false
